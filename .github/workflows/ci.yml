name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
  SHOPIFY_STOREFRONT_PRIVATE_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_PRIVATE_TOKEN }}
  SHOPIFY_API_VERSION: "2026-07"

jobs:
  verify:
    name: codegen · typecheck · lint · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Queries and generated types must be in sync. Codegen fetches the schema
      # from Shopify's public proxy, so no token is needed for this step.
      - name: Codegen is clean
        run: |
          pnpm codegen
          git diff --exit-code -- types/

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Every Shopify-backed route must render dynamically (ƒ). A static (○)
      # route would bake product data into the build.
      - name: Build, routes dynamic
        run: |
          pnpm build | tee build.log
          if grep -E '○ +/(products/[^ ]*)?$' build.log; then
            echo "::error::A Shopify-backed route is being prerendered statically"
            exit 1
          fi

      - name: Upload build for e2e
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: playwright smoke
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # The e2e pass hits the live dev store, so it needs the Storefront
      # secrets. Until they are set (Settings → Secrets → Actions), the job
      # passes with a warning instead of failing on an empty domain.
      - id: gate
        run: |
          if [ -z "$SHOPIFY_STORE_DOMAIN" ] || [ -z "$SHOPIFY_STOREFRONT_PRIVATE_TOKEN" ]; then
            echo "::warning::SHOPIFY_STORE_DOMAIN / SHOPIFY_STOREFRONT_PRIVATE_TOKEN secrets not set; skipping e2e"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.gate.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - if: steps.gate.outputs.skip != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.gate.outputs.skip != 'true'
        run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
